# ArchUnit configuration for CTAM services. Install at src/test/resources/archunit.properties.
#
# A story creates packages incrementally, and not every service has a client/ or a domain/ at all.
# ArchUnit's default is to FAIL a rule whose that()-clause matched no classes — a sensible typo
# guard in a mature codebase, but on a scaffold it fails almost every rule for the wrong reason,
# and mid-story it fails rules about packages this story was never meant to create.
#
# Trade-off accepted knowingly: with this off, a mistyped package constant in
# ArchitectureFitnessTest checks nothing and passes silently. Review changes to those constants.
archRule.failOnEmptyShould=false
